name: Build task images

# Builds each task's environment image (linux/amd64, what HF Sandbox runs), pushes it to GHCR
# under the tag in its task.toml, then checks the published image the way HF Sandbox will use
# it: pulled anonymously, oracle scores 1.0, nop scores 0.0.

on:
  push:
    branches: [main]
    paths: ["tasks/**", "scripts/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Rebuild and re-check every task, not only those missing an image"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          ALL: ${{ inputs.all && '--all' || '' }}
        run: python3 scripts/plan_images.py tasks $ALL | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tasks/${{ matrix.task }}/environment
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # One plain manifest: no attestation index for the sandbox runtime to resolve.
          provenance: false
          sbom: false

  verify:
    needs: [plan, build]
    # Run even when some builds failed: each task reports its own result.
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Pull anonymously, as HF Sandbox does
        env:
          IMAGE: ${{ matrix.image }}
          REPO: ${{ github.repository }}
        run: |
          if ! docker pull "$IMAGE"; then
            echo "::error::$IMAGE is not publicly pullable. Make the ghcr.io/$REPO package public."
            exit 1
          fi
      - name: Controls (oracle 1.0, nop 0.0)
        env:
          TASK: ${{ matrix.task }}
        run: python3 scripts/check_controls.py "tasks/$TASK"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controls-${{ matrix.task }}
          path: jobs/
          retention-days: 14
